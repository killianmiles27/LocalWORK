[package]
name = "localwork"
version = "0.1.4"
description = "Local Work-Style AI desktop app"
license = "Apache-2.0"
repository = "https://github.com/killianmiles27/LocalWORK"
edition = "2021"

[lib]
name = "localwork_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
toml_edit = "0.25"
base64 = "0.22"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "component"] }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
