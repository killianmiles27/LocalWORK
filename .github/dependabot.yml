version: 2
updates:
  # Pause routine upgrades while keeping security-update PRs and CI audits available.
  # Set a small positive limit per ecosystem when resuming planned dependency maintenance.
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      root-npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /scripts/vendor-browser
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      browser-npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /workbench-mcp
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
