name: Linux build

# Builds the Linux packages (AppImage, deb, rpm) without signing them. The release is signed
# on the maintainer's machine; the signing key never leaves it (see docs/release.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Reuse the expensive release bundle rather than building an AppImage in every Checks run.
  pull_request:
    paths:
      - '.github/workflows/linux-release.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'workbench-mcp/**'
      - 'scripts/**'
      - 'patches/**'
      - 'vendor/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.*'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distributions
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf file xdg-utils rpm xvfb dbus-x11 python3-pyatspi at-spi2-core xdotool
      - name: Pinned runtime tools
        run: bash scripts/fetch-vendor-linux.sh
      - name: Bundle
        # Updater signatures are made locally after download.
        run: |
          npm ci
          npm run tauri -- build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check the packaged tools are executable
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          tools=$(dpkg-deb -c "$deb" | grep -E 'vendor/(aionrs|officecli|node/node|whisper/whisper-cli)$')
          echo "$tools"
          [ "$(echo "$tools" | wc -l)" = 4 ] || { echo 'A bundled tool is missing'; exit 1; }
          if echo "$tools" | grep -v '^-rwxr-xr-x'; then echo 'A bundled tool lost its executable bit'; exit 1; fi
          for v in 312 313; do
            dpkg-deb -c "$deb" | grep -q "libs/lxml/etree\.cpython-$v-x86_64-linux-gnu\.so" \
              || { echo "The web libraries for Python 3.${v#3} are missing"; exit 1; }
          done
      - name: Packaged desktop smoke test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then echo 'Expected exactly one AppImage' >&2; exit 1; fi
          export LOCALWORK_SMOKE_PYTHON="$(command -v python)"
          dbus-run-session -- xvfb-run -a --server-args='-screen 0 1280x1024x24' /usr/bin/python3 scripts/e2e/linux-smoke.py "${images[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
