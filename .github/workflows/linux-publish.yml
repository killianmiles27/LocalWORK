name: Linux publish

# Copies the Linux packages (and optionally the Windows installer) from a finished "Linux build" run into an existing release, so they
# go from GitHub to GitHub instead of through the maintainer's connection. The AppImage .sig is
# made locally from the same run's AppImage and uploaded with the rest of the release.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the successful "Linux build" run
        required: true
      tag:
        description: Release tag, for example v0.1.5
        required: true
      windows_run_id:
        description: Optional ID of the successful "Windows build" run whose installer you signed
        required: false

permissions: {}

jobs:
  publish:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          WIN_RUN_ID: ${{ inputs.windows_run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'run_id must be a number'; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'tag must look like v1.2.3'; exit 1; }
          [ "$(gh run view "$RUN_ID" --json workflowName,conclusion --jq '.workflowName + " " + .conclusion')" = 'Linux build success' ] \
            || { echo 'That run is not a successful Linux build'; exit 1; }
          gh run download "$RUN_ID" -n linux-bundles -D bundles
          mapfile -t files < <(find bundles -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \))
          [ "${#files[@]}" = 3 ] || { echo "Expected 3 packages, found ${#files[@]}"; exit 1; }
          if [ -n "$WIN_RUN_ID" ]; then
            [[ "$WIN_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'windows_run_id must be a number'; exit 1; }
            [ "$(gh run view "$WIN_RUN_ID" --json workflowName,conclusion --jq '.workflowName + " " + .conclusion')" = 'Windows build success' ] \
              || { echo 'That run is not a successful Windows build'; exit 1; }
            gh run download "$WIN_RUN_ID" -n windows-installer -D windows
            mapfile -t win < <(find windows -type f -name '*-setup.exe')
            [ "${#win[@]}" = 1 ] || { echo "Expected 1 installer, found ${#win[@]}"; exit 1; }
            files+=("${win[@]}")
          fi
          # PKGBUILD is prepared locally from the exact deb and attached before this job.
          gh release download "$TAG" --pattern PKGBUILD --dir publish
          for file in "${files[@]}"; do
            name=${file##*/}
            [ ! -e "publish/$name" ] || { echo "Duplicate asset name: $name"; exit 1; }
            cp -- "$file" "publish/$name"
          done
          cd publish
          export LC_ALL=C
          assets=(*)
          sha256sum -- "${assets[@]}" | tee SHA256SUMS
          gh release upload "$TAG" "${assets[@]}" SHA256SUMS --clobber
